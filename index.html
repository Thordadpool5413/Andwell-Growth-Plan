<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Andwell Maine Innovation and Growth Plan dashboard" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Andwell Growth Plan</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("andwell-theme");
          var useDark = storedTheme == null ? true : storedTheme === "dark";
          document.documentElement.classList.toggle("dark", useDark);
          document.documentElement.style.colorScheme = useDark ? "dark" : "light";
        } catch (error) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
